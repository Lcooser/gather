services:
  postgres:
    image: "postgres:17"
    container_name: gather-postgres
    restart: always
    environment:
      POSTGRES_DB: gather
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: "redis:7.4-alpine"
    container_name: gather-redis
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass postgres
      --appendonly yes
      --notify-keyspace-events Egx
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "postgres", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: