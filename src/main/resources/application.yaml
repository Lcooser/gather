spring:
  application:
    name: gather

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: postgres
      connect-timeout: 2s
      timeout: 2s

  session:
    data:
      redis:
        repository-type: indexed
        namespace: gather:session
        flush-mode: on-save

  datasource:
    url: jdbc:postgresql://localhost:5433/gather
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: GATHER_SESSION
        http-only: true
        same-site: lax